# -- Site Configuration --
# 主题：Hextra（themes/hextra 子模块）
# 结构与参数名参照主题自带 exampleSite/config/_default/

theme = "hextra"
baseURL = "/"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = true
disableKinds = ["taxonomy", "term"]

hasCJKLanguage = true
summaryLength = 30
enableEmoji = true

[pagination]
  pagerSize = 20

[imaging]
  anchor = "Center"

[outputs]
  home = ["HTML", "RSS"]

# Hextra 构建期从 jsdelivr 拉 flexsearch；本机 DNS 走代理 fake-IP（198.18.0.0/15），
# 需放行该网段与 CDN 域名（其余为 Hugo 默认规则；CI 无代理，实际只用得上 jsdelivr 那条）。
[security]
  [security.http]
    urls = [
      '(?i)^https?://198\.18\.',
      '(?i)^https?://cdn\.jsdelivr\.net/',
      '(?i)^https?://[a-z0-9]',
      '! (?i)^https?://\d+\.',
      '! (?i)localhost',
      '! (?i)^https?://[^/?#]*@',
    ]
