# Deploy Hugo site to GitHub Pages
# 官方模板改编：https://gohugo.io/hosting-and-deployment/hosting-on-github/
#
# 首次部署前需在仓库 Settings → Pages 把 Source 设为 **GitHub Actions**（一次性）。
# 推 main 自动构建部署；也可在 Actions 页手动 Run workflow。
# baseURL 由 configure-pages 注入（https://luna-jmy.github.io/ob-plugin-docs/），
# 因此 config/_default/hugo.toml 里的 baseURL="/" 专为本地预览保留，两边互不干扰。

name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次部署；排队不取消（中途掐掉会留下半部署状态）
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 与本地开发版本保持一致（extended：两个主题都要求）
      HUGO_VERSION: 0.167.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
